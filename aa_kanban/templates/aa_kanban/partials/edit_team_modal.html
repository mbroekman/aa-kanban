{% load i18n %}
<div class="modal-header bg-light">
    <h5 class="modal-title" id="teamUsersModalLabel">
        <i class="fas fa-edit me-2 text-primary"></i>{% trans "Edit Team:" %} {{ team.name }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>
<form hx-post="{% url 'aa_kanban:edit_kanban_team' team.id %}"
      hx-target="#team-list-container"
      hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label for="editTeamName" class="form-label fw-bold">{% trans "Team Name" %}</label>
            <input type="text"
                   class="form-control"
                   id="editTeamName"
                   name="name"
                   value="{{ team.name }}"
                   required>
        </div>
        <div class="mb-3">
            <label for="editDiscordRoleId" class="form-label fw-bold">{% trans "Discord Role ID" %}</label>
            <input type="text"
                   class="form-control"
                   id="editDiscordRoleId"
                   name="discord_role_id"
                   value="{{ team.discord_role_id|default_if_none:'' }}"
                   placeholder="{% trans 'Optional Discord Role ID' %}">
            <div class="form-text">{% trans "Optional Discord Role ID to ping when a ticket is assigned to this team." %}</div>
        </div>
        <div class="mb-3">
            <label for="editTicketBoard" class="form-label fw-bold">{% trans "Target Ticket Board" %}</label>
            <select class="form-select" id="editTicketBoard" name="ticket_board_id">
                <option value="">-- {% trans "Select Board" %} --</option>
                {% for board in boards %}
                    <option value="{{ board.id }}" {% if team.ticket_board_id == board.id %}selected{% endif %}>{{ board.name }}</option>
                {% endfor %}
            </select>
            <div class="form-text">{% trans "Tickets assigned to this team will be created on this board." %}</div>
        </div>
    </div>
    <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i>{% trans "Save changes" %}
        </button>
    </div>
</form>
