{% load i18n %}
{% if labels %}
    <ul class="list-group list-group-flush border rounded">
        {% for label in labels %}
            <li class="list-group-item d-flex justify-content-between align-items-center py-2">
                <div>
                    <span class="badge bg-{{ label.color }} text-white py-1 px-2">{{ label.name }}</span>
                    {% if label.is_ticket_label %}
                        <span class="badge bg-light text-dark border ms-2" title="{% trans 'Ticket Label' %}"><i class="fas fa-ticket-alt"></i></span>
                    {% endif %}
                </div>
                <div class="text-nowrap">
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary me-1"
                            data-bs-toggle="modal"
                            data-bs-target="#labelModal"
                            hx-get="{% url 'aa_kanban:edit_settings_label' label.id %}"
                            hx-target="#labelModalBody"
                            title="{% trans 'Edit Label' %}">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            hx-post="{% url 'aa_kanban:delete_settings_label' label.id %}"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                            hx-target="#label-list-container"
                            hx-confirm="{% trans 'Delete this label permanently? It will be removed from all cards.' %}"
                            title="{% trans 'Delete Label' %}">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="alert alert-light text-center small mb-0 border">
        <em>{% trans "No global labels defined yet." %}</em>
    </div>
{% endif %}
