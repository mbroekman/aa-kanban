{% load i18n %}
{# Partial: bewerken bestaand board — geladen via HTMX in modal #}
<div class="modal-header">
    <h5 class="modal-title" id="boardModalLabel">
        <i class="fas fa-cog me-2 text-secondary"></i>{% trans "Board Settings" %}: {{ board.name }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>

<form method="post" action="{% url 'aa_kanban:edit_board' board.slug %}">
    {% csrf_token %}
    <div class="modal-body">
        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <div class="mb-3">
            <label for="edit-board-name" class="form-label fw-semibold">
                {% trans "Board name" %} <span class="text-danger">*</span>
            </label>
            <input type="text"
                   id="edit-board-name"
                   name="name"
                   class="form-control"
                   value="{{ form_data.name|default:board.name }}"
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="edit-board-description" class="form-label fw-semibold">
                {% trans "Description" %}
            </label>
            <textarea id="edit-board-description"
                      name="description"
                      class="form-control"
                      rows="2">{{ form_data.description|default:board.description }}</textarea>
        </div>

        <div class="mb-3">
            <label for="edit-board-view-groups" class="form-label fw-semibold">
                <i class="fas fa-eye me-1 text-secondary"></i>{% trans "View access (groups)" %}
            </label>
            <select id="edit-board-view-groups"
                    name="view_groups"
                    class="form-select"
                    multiple
                    size="5">
                {% for group in all_groups %}
                    <option value="{{ group.pk }}"
                        {% if group in board.view_groups.all %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">{% trans "Hold Ctrl/Cmd to select multiple groups." %}</div>
        </div>

        <div class="mb-3">
            <label for="edit-board-write-groups" class="form-label fw-semibold">
                <i class="fas fa-pen me-1 text-secondary"></i>{% trans "Write access (groups)" %}
            </label>
            <select id="edit-board-write-groups"
                    name="write_groups"
                    class="form-select"
                    multiple
                    size="5">
                {% for group in all_groups %}
                    <option value="{{ group.pk }}"
                        {% if group in board.write_groups.all %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">{% trans "Hold Ctrl/Cmd to select multiple groups." %}</div>
        </div>
    </div>

    <div class="modal-footer d-flex justify-content-between">
        <button type="button"
                class="btn btn-outline-danger"
                hx-post="{% url 'aa_kanban:delete_board' board.slug %}"
                hx-confirm="{% trans 'Are you sure you want to permanently delete this board and all its data?' %}"
                hx-push-url="{% url 'aa_kanban:index' %}">
            <i class="fas fa-trash-alt me-1"></i>{% trans "Delete Board" %}
        </button>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                {% trans "Cancel" %}
            </button>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>{% trans "Save Changes" %}
            </button>
        </div>
    </div>
</form>
