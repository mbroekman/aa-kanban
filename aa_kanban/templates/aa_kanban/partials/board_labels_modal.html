{% load i18n %}

<div class="modal-header border-bottom-0 pb-0">
    <h5 class="modal-title fw-bold text-dark mb-1" id="labelsModalLabel">{% trans "Manage Labels" %}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body pt-3">
    <p class="small text-muted mb-3">{% trans "Manage labels for board:" %} <strong>{{ board.name }}</strong></p>

    <!-- List of existing labels -->
    <div class="mb-4">
        {% if labels %}
            <ul class="list-group list-group-flush border rounded">
                {% for label in labels %}
                    <li class="list-group-item d-flex justify-content-between align-items-center py-2">
                        <div>
                            <span class="badge bg-{{ label.color }} text-white py-1 px-2">{{ label.name }}</span>
                        </div>
                        <button type="button" class="btn btn-sm text-danger border-0 p-0"
                                hx-post="{% url 'aa_kanban:delete_label' label.id %}"
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-target="#labelsModalBody"
                                hx-confirm="{% trans 'Delete this label permanently? It will be removed from all cards.' %}"
                                title="{% trans 'Delete label' %}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-light text-center small mb-0 border">
                <em>{% trans "No labels defined for this board yet." %}</em>
            </div>
        {% endif %}
    </div>

    <!-- Create new label form -->
    <form hx-post="{% url 'aa_kanban:create_label' board.slug %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-target="#labelsModalBody"
          class="bg-light p-3 rounded border">
        <label class="form-label small fw-bold text-muted text-uppercase mb-2">{% trans "Create New Label" %}</label>
        
        <div class="mb-2">
            <input type="text" class="form-control form-control-sm" name="name" placeholder="{% trans 'Label name...' %}" required maxlength="50">
        </div>
        
        <div class="mb-3">
            <select name="color" class="form-select form-select-sm" required>
                <option value="primary" class="text-primary">Primary (Blue)</option>
                <option value="secondary" class="text-secondary">Secondary (Grey)</option>
                <option value="success" class="text-success">Success (Green)</option>
                <option value="danger" class="text-danger">Danger (Red)</option>
                <option value="warning" class="text-warning">Warning (Yellow)</option>
                <option value="info" class="text-info">Info (Light Blue)</option>
                <option value="dark" class="text-dark">Dark (Black)</option>
            </select>
        </div>
        
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>{% trans "Add Label" %}
            </button>
        </div>
    </form>
</div>
