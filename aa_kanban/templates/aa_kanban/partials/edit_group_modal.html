{% load i18n %}
<div class="modal-header bg-light">
    <h5 class="modal-title" id="groupUsersModalLabel">
        <i class="fas fa-edit me-2 text-primary"></i>{% trans "Edit Group:" %} {{ group.name }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>
<form hx-post="{% url 'aa_kanban:edit_group' group.pk %}"
      hx-target="#group-list-container"
      hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label for="editGroupName" class="form-label fw-bold">{% trans "Group Name" %}</label>
            <input type="text"
                   class="form-control"
                   id="editGroupName"
                   name="name"
                   value="{{ group.name }}"
                   required>
        </div>
    </div>
    <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i>{% trans "Save changes" %}
        </button>
    </div>
</form>
