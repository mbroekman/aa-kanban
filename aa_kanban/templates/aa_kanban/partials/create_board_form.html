{% load i18n %}
{# Partial: aanmaken nieuw board — geladen via HTMX in modal #}
<div class="modal-header">
    <h5 class="modal-title" id="boardModalLabel">
        <i class="fas fa-plus-circle me-2 text-primary"></i>{% trans "New Kanban Board" %}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>

<form method="post" action="{% url 'aa_kanban:create_board' %}">
    {% csrf_token %}
    <div class="modal-body">
        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <div class="mb-3">
            <label for="board-name" class="form-label fw-semibold">
                {% trans "Board name" %} <span class="text-danger">*</span>
            </label>
            <input type="text"
                   id="board-name"
                   name="name"
                   class="form-control"
                   placeholder="{% trans 'e.g. Sprint Q3' %}"
                   value="{{ form_data.name|default:'' }}"
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="board-description" class="form-label fw-semibold">
                {% trans "Description" %}
            </label>
            <textarea id="board-description"
                      name="description"
                      class="form-control"
                      rows="2"
                      placeholder="{% trans 'Optional description...' %}">{{ form_data.description|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label for="board-view-groups" class="form-label fw-semibold">
                <i class="fas fa-eye me-1 text-secondary"></i>{% trans "View access (groups)" %}
            </label>
            <select id="board-view-groups"
                    name="view_groups"
                    class="form-select"
                    multiple
                    size="5">
                {% for group in all_groups %}
                    <option value="{{ group.pk }}"
                        {% if form_data and group.pk|stringformat:"s" in form_data.getlist|default:'' %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">{% trans "Hold Ctrl/Cmd to select multiple groups." %}</div>
        </div>

        <div class="mb-3">
            <label for="board-write-groups" class="form-label fw-semibold">
                <i class="fas fa-pen me-1 text-secondary"></i>{% trans "Write access (groups)" %}
            </label>
            <select id="board-write-groups"
                    name="write_groups"
                    class="form-select"
                    multiple
                    size="5">
                {% for group in all_groups %}
                    <option value="{{ group.pk }}">
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
            <div class="form-text">{% trans "Hold Ctrl/Cmd to select multiple groups." %}</div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            {% trans "Cancel" %}
        </button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>{% trans "Create Board" %}
        </button>
    </div>
</form>
