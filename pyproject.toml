[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-kanban"
description = "Kanban Plugin for Alliance Auth"
readme = "README.md"
keywords = [
    "aa_kanban",
    "allianceauth",
]
license = { file = "LICENSE" }
authors = [
    { name = "Maddog Broekman", email = "maddogbroekman@gmail.com" },
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
]

[tool.hatch]
version.path = "aa_kanban/__init__.py"
build.include = [
    "/aa_kanban",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "testauth",
]
lint.select = [ "E", "F", "I", "W" ]
lint.ignore = []
lint.per-file-ignores."**/migrations/*" = [ "E501" ]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
plugins = [ "mypy_django_plugin.main" ]

[tool.django-stubs]
django_settings_module = "testauth.settings.local"

[tool.pytest]
ini_options.python_files = [ "*_test.py", "test_*.py" ]
ini_options.DJANGO_SETTINGS_MODULE = "testauth.settings"
